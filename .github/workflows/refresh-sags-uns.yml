name: Refresh green reports snapshot

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-sags-uns-snapshot.mjs
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- Apps/Data/sags-uns-snapshot.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Apps/Data/sags-uns-snapshot.json
          git commit -m 'Refresh Sag uns green reports snapshot'
          git push
