<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174d38" />
    <meta name="author" content="Stadt Köln, Amt für Landschaftspflege und Grünflächen" />
    <meta
      name="description"
      content="Grün Atlas Köln, entwickelt von der Stadt Köln, Amt für Landschaftspflege und Grünflächen. Parks, Bäume und grüne Orte auf einer interaktiven Karte entdecken."
    />
    <title>Grün Atlas Köln · Entdecke deine grüne Stadt</title>
    <link rel="icon" href="Images/gruen-atlas.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../Build/Cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="GreenAtlas.css" />
    <script>
      window.CESIUM_BASE_URL = "../Build/Cesium/";
      window.GREEN_ATLAS_MODE = true;
    </script>
    <script src="../Build/Cesium/Cesium.js" defer></script>
    <script src="GreenAtlasData.js" defer></script>
    <script src="GreenTrees.js" defer></script>
    <script src="GreenReports.js" defer></script>
    <script src="GreenAtlasMap.js" defer></script>
    <script src="AIChatBot.js" defer></script>
    <script src="GreenAI.js" defer></script>
    <script src="GreenAtlas.js" defer></script>
    <script src="3DHeritageScripts.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#mapWorkspace">Zur Karte</a>
    <header class="app-header">
      <a
        class="brand"
        href="3DHeritageMapApp.html"
        aria-label="Grün Atlas Köln, entwickelt von der Stadt Köln, Amt für Landschaftspflege und Grünflächen. Startseite"
        ><img src="Images/gruen-atlas.svg" alt="" width="38" height="38" /><span
          >GRÜN ATLAS<small>KÖLN</small><span class="brand-office"
            >Stadt Köln · Amt für Landschaftspflege und Grünflächen</span
          ></span
        ></a
      >
      <div class="search-wrap">
        <span data-icon="search"></span
        ><input
          id="greenSearch"
          type="search"
          placeholder="Grünes Köln durchsuchen …"
          aria-label="Grünes Köln durchsuchen"
          aria-controls="searchResults"
          aria-expanded="false"
          autocomplete="off"
        /><kbd>/</kbd>
        <section
          id="searchResults"
          class="search-results"
          aria-label="Suchergebnisse"
          hidden
        ></section>
      </div>
      <div class="header-actions">
        <span class="demo-pill"><i></i> Demo entdecken</span
        ><button class="city-button" id="cityHome" title="Ganz Köln anzeigen">
          <span data-icon="pin"></span> Köln <span data-icon="chevron"></span>
        </button>
      </div>
    </header>
    <aside class="sidebar" aria-label="Hauptnavigation">
      <div class="sidebar-top">
        <span class="eyebrow">DEIN GRÜNES KÖLN</span
        ><button class="nav-item active" data-view="explore">
          <span data-icon="compass"></span>Entdecken<span class="nav-arrow"
            >↗</span
          >
        </button>
      </div>
      <span class="nav-label">THEMEN ENTDECKEN</span>
      <nav id="themeNavigation" aria-label="Grün-Themen"></nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="layers">
          <span data-icon="layers"></span>Kartenebenen<span
            id="layerCount"
            class="nav-count"
            >3</span
          ></button
        ><button class="nav-item" data-view="favorites">
          <span data-icon="heart"></span>Meine Orte<span
            id="favoriteCount"
            class="nav-count"
            >0</span
          ></button
        ><button class="nav-item" data-view="about">
          <span data-icon="info"></span>Über Grün Atlas
        </button>
        <div class="sidebar-note">
          <span class="leaf-dot"></span> Stadt Köln<small
            >Amt für Landschaftspflege und Grünflächen</small
          >
        </div>
      </div>
    </aside>
    <main
      id="mapWorkspace"
      class="map-workspace"
      tabindex="-1"
      aria-label="Interaktive Karte von Köln"
    >
      <div id="cesiumContainer"></div>
      <div id="loadingScreen" role="status">
        <span class="loader"></span> Dein grünes Köln wird geladen …
      </div>
      <div class="map-heading">
        <span class="map-live"></span><span>Köln entdecken</span
        ><span class="map-divider"></span
        ><span id="visibleCount">Karte lädt</span>
      </div>
      <section
        id="contentPanel"
        class="content-panel"
        aria-label="Entdecken"
      ></section>
      <div class="map-tools" aria-label="Kartensteuerung">
        <button id="zoomIn" aria-label="Vergrößern" title="Vergrößern">
          <span data-icon="plus"></span></button
        ><button id="zoomOut" aria-label="Verkleinern" title="Verkleinern">
          <span data-icon="minus"></span></button
        ><span class="tool-divider"></span
        ><button
          id="locateMe"
          aria-label="Meinen Standort anzeigen"
          title="Meinen Standort anzeigen"
        >
          <span data-icon="locate"></span></button
        ><button
          data-view="layers"
          aria-label="Kartenebenen öffnen"
          title="Kartenebenen"
        >
          <span data-icon="layers"></span></button
        ><button
          id="mapMode"
          aria-label="3D-Ansicht aktivieren"
          title="Ansicht neigen"
        >
          3D</button
        ><button id="fullscreen" aria-label="Vollbild" title="Vollbild">
          <span data-icon="expand"></span>
        </button>
      </div>
      <div class="map-bottom">
        <button id="basemapButton" class="basemap-button">
          <span class="basemap-preview"></span
          ><span>Grundkarte<small id="basemapName">Stadtkarte</small></span
          ><span data-icon="chevron"></span>
        </button>
        <div id="mapLegend" class="map-legend" aria-label="Kartenlegende"></div>
      </div>
      <section
        id="basemapPanel"
        class="basemap-panel"
        aria-label="Grundkarte auswählen"
        hidden
      >
        <h3>Dein Blick auf Köln</h3>
        <button data-basemap="basemap-libre" aria-pressed="true">
          Helle Stadtkarte <small>basemap.de · GeoBasis-DE</small></button
        ><button data-basemap="osm" aria-pressed="false">
          Detailkarte <small>OpenStreetMap</small></button
        ><button data-basemap="nrw-aerial" aria-pressed="false">
          Luftbild <small>Digitale Orthophotos · Geobasis NRW</small>
        </button>
        <p id="basemapStatus" role="status"></p>
      </section>
      <button
        id="greenAIButton"
        class="ai-launcher"
        aria-expanded="false"
        aria-controls="aiChatPanel"
      >
        <span data-icon="sparkles"></span><span>GrünAI</span
        ><span class="ai-button-note">Frag deine Stadt</span>
      </button>
      <section
        id="objectPanel"
        class="object-panel"
        aria-label="Ort im Detail"
        hidden
      ></section>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <nav class="mobile-nav" aria-label="Mobile Navigation">
      <button data-view="explore">
        <span data-icon="compass"></span>Entdecken</button
      ><button id="mobileMap"><span data-icon="map"></span>Karte</button
      ><button id="mobileSearch"><span data-icon="search"></span>Suche</button
      ><button id="mobileAI"><span data-icon="sparkles"></span>GrünAI</button>
    </nav>
    <noscript
      >Bitte aktiviere JavaScript, um die interaktive Karte zu
      verwenden.</noscript
    >
  </body>
</html>
